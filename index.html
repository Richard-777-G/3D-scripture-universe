<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Scripture Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<meta name="description" content="An interactive 3D map of how the whole Bible points to Jesus Christ: %BOOKS% books, %LINKS% connected verse pairs, a guided %STEPS%-step story, historical evidence and a reader with Hebrew and Greek words.">
<meta name="theme-color" content="#05070d">
</head>
<body>
<div id="stage">
<canvas id="gl" tabindex="0" aria-label="3D model of the Bible: Old Testament books in a lower ring, New Testament books in an upper ring, joined by threads for each cross-reference"></canvas>
<div id="labels"></div>
<div id="top"></div>
<div id="hint">Drag to rotate &middot; pinch to zoom &middot; tap a book</div>
<div id="perf">Performance mode</div>
<div id="pop" role="menu"></div>
<button id="pshow" aria-label="Show the panel">Show guide</button>
<button id="prest" aria-label="Show the panel again"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span></span></button>
<div id="brand"><b>Scripture Universe</b><span>How the whole Bible points to Jesus</span></div>
<button id="cta" aria-label="Start the story: %STEPS% steps from the first promise to his return"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg>Start the story here<i></i></button>
</div>
<div id="panel" role="region" aria-label="Details"><div id="phd"><button class="btn" id="pback" aria-label="Go back">‹ Back</button><span id="pttl"></span><button class="btn" id="pmin" aria-label="Minimise the panel" title="Minimise to see the 3D view"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13l6 6 6-6"/><path d="M5 5h14"/></svg></button><button class="btn" id="pexp" aria-label="Make the panel bigger"></button><button class="btn" id="clr">Close</button></div><div id="psc"><div id="pc"></div></div><div id="pft"></div></div>
<nav id="tabs" aria-label="Sections">
<button id="tab-story" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg>Story</button>
<button id="tab-explore" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 15.5l2-6 6-2-2 6z"/></svg>Explore</button>
<button id="tab-evidence" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 4.5-3.2 7.7-8 9-4.8-1.3-8-4.5-8-9V7z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Evidence</button>
<button id="tab-search" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>Search</button>
<button id="tab-library" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM10.5 6h4v14h-4zM16 5.6l3.8 1-3.2 13-3.8-1z"/></svg>Library</button>
</nav>
<div id="sheet" role="dialog" aria-modal="true"><button class="x" id="sx" aria-label="Close">&times;</button><div id="sc"></div></div>
<div id="intro" role="dialog" aria-modal="true" aria-label="How this works"><div class="ibox"><div id="ipg"></div><div class="idots" id="idots"></div><div class="ibtns" id="ibtns"></div></div></div>
<div id="vpk" role="dialog" aria-modal="true" aria-label="Choose a Bible version"><div class="vb" id="vpkb"></div></div>
<div id="err"><div><b>This 3D view needs WebGL.</b><br>Please try another browser, or turn on hardware acceleration.</div></div>
<div id="boot" role="status" aria-live="polite"><div class="boot-in"><b>Scripture Universe</b><span id="boot-msg">Loading the Bible…</span><button id="boot-retry" hidden>Try again</button></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
